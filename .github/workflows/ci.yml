name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go tool gqlgen generate
      # gqlgen adds a panicking stub for any new field. A diff here means a resolver is missing.
      - run: git diff --exit-code graph/resolver.go
      - run: go vet ./...
      - run: go test -race ./...

  schema-check:
    runs-on: ubuntu-latest
    env:
      APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
      APOLLO_ELV2_LICENSE: accept
    steps:
      - uses: actions/checkout@v7
      - uses: apollographql/rover-actions/install-rover-cli@v1
      - run: rover subgraph check storefront-homelab@test --name reviews --schema schema.graphql

  build-and-push:
    needs: [test, schema-check]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: cujarrett/homelab/.github/workflows/build-image.yml@main
    with:
      image: ghcr.io/cujarrett/storefront-reviews
      tags: |
        ghcr.io/cujarrett/storefront-reviews:sha-${{ github.sha }}
      cache-scope: storefront-reviews
