name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go tool gqlgen generate
      # gqlgen adds a panicking stub for any new field. A diff here means a resolver is missing.
      - run: git diff --exit-code graph/resolver.go
      - run: go vet ./...
      - run: go test -race ./...

  schema-check:
    runs-on: ubuntu-latest
    env:
      APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
      APOLLO_ELV2_LICENSE: accept
    steps:
      - uses: actions/checkout@v7
      - uses: apollographql/rover-actions/install-rover-cli@v1
      - run: rover subgraph check storefront-homelab@test --name reviews --schema schema.graphql

  build-and-push:
    needs: [test, schema-check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v4.1.3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          # A plain manifest, not an index. Kyverno resolves an index by looking for
          # an amd64 child, which a single-arch image never has, and fails there.
          provenance: false
          sbom: false
          push: true
          tags: ghcr.io/cujarrett/storefront-reviews:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Signed by digest, because a tag can be moved after signing. This job
      # runs only on main, so a signature means the commit was reviewed.
      - run: cosign sign --yes ghcr.io/cujarrett/storefront-reviews@${{ steps.build.outputs.digest }}
      # The SBOM sits beside the image as a signed attestation.
      # A buildx SBOM would turn the image into an index, which Kyverno can't resolve.
      # Pinned by commit. This job holds the token that signs images Kyverno trusts.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/cujarrett/storefront-reviews@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json ghcr.io/cujarrett/storefront-reviews@${{ steps.build.outputs.digest }}
