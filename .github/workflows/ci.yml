name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  schema-check:
    runs-on: ubuntu-latest
    env:
      APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
      APOLLO_ELV2_LICENSE: accept
    steps:
      - uses: actions/checkout@v7
      - uses: apollographql/rover-actions/install-rover-cli@v1
      - run: rover subgraph check storefront-homelab@test --name reviews --schema schema.graphql

  build-and-push:
    needs: [test, schema-check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          # A plain manifest, not an index. Kyverno resolves an index by looking for
          # an amd64 child, which a single-arch image never has, and fails there.
          provenance: false
          sbom: false
          push: true
          tags: ghcr.io/cujarrett/storefront-reviews:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Signed by digest, because a tag can be moved after signing. This job
      # runs only on main, so a signature means the commit was reviewed.
      - run: cosign sign --yes ghcr.io/cujarrett/storefront-reviews@${{ steps.build.outputs.digest }}

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liC9AQ1xrWzEe4nX
          private-key: ${{ secrets.HOMELAB_WORKSPACES_APP_KEY }}
          repositories: homelab-workspaces
      - uses: actions/checkout@v7
        with:
          repository: cujarrett/homelab-workspaces
          token: ${{ steps.app-token.outputs.token }}
      # The whole image line is replaced, so a rename of the image survives.
      - run: |
          sed -i "s|^\(\s*\)image: .*|\1image: ghcr.io/cujarrett/storefront-reviews@${{ needs.build-and-push.outputs.digest }}|" graph-test/reviews.yaml
          if git diff --quiet; then echo "test already runs this digest"; exit 0; fi
          git config user.name "homelab-workspaces-deployer[bot]"
          git config user.email "344521357+homelab-workspaces-deployer[bot]@users.noreply.github.com"
          git commit -am "reviews: deploy ${{ needs.build-and-push.outputs.digest }}"
          git push

  # Every deploy to test proposes itself for prod. The human step is merging the PR.
  # One branch per subgraph, force-pushed, so a newer digest replaces an unmerged one.
  promote:
    needs: [build-and-push, deploy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
      APOLLO_ELV2_LICENSE: accept
      IMAGE: ghcr.io/cujarrett/storefront-reviews@${{ needs.build-and-push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: apollographql/rover-actions/install-rover-cli@v1
      - run: rover subgraph check storefront-homelab@prod --name reviews --schema schema.graphql
      # What a reviewer judges: how the schema prod serves would change, and which PRs it carries.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rover subgraph fetch storefront-homelab@prod --name reviews > prod.graphql || : > prod.graphql
          {
            echo "Moves \`graph-prod/reviews.yaml\` to the digest running in test. Merging this promotes it."
            echo
            echo "**Source** ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
            echo "**Checks** composes with every other prod subgraph and passes prod's recent operations."
            echo
            echo "### Schema change against prod"
            if diff -q prod.graphql schema.graphql >/dev/null; then
              echo "No schema change. Code only."
            else
              echo '```diff'
              diff -u --label prod --label "this PR" prod.graphql schema.graphql || true
              echo '```'
            fi
            # The last merged promote PR names the commit prod runs.
            prev=$(gh pr list -R cujarrett/homelab-workspaces --head promote-reviews --state merged --limit 1 --json body -q '.[0].body' | grep -o 'commit/[0-9a-f]\{40\}' | head -1 | cut -d/ -f2 || true)
            if [ -n "$prev" ]; then
              echo
              echo "### PRs since prod"
              echo "[Full diff](${{ github.server_url }}/${{ github.repository }}/compare/$prev...${{ github.sha }})"
              echo
              for c in $(gh api "repos/${{ github.repository }}/compare/$prev...${{ github.sha }}" -q '.commits[].sha'); do
                gh api "repos/${{ github.repository }}/commits/$c/pulls" -q '.[] | "- \(if (.user.login | endswith("[bot]")) then "Dependencies" else "Code" end): [#\(.number) \(.title)](\(.html_url))"'
              done | sort -u
            fi
          } > "$RUNNER_TEMP/pr-body.md"
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liC9AQ1xrWzEe4nX
          private-key: ${{ secrets.HOMELAB_WORKSPACES_APP_KEY }}
          repositories: homelab-workspaces
      - uses: actions/checkout@v7
        with:
          repository: cujarrett/homelab-workspaces
          token: ${{ steps.app-token.outputs.token }}
          path: homelab-workspaces
      - working-directory: homelab-workspaces
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git checkout -B promote-reviews
          sed -i "s|^\(\s*\)image: .*|\1image: $IMAGE|" graph-prod/reviews.yaml
          if git diff --quiet; then echo "prod already runs $IMAGE"; exit 0; fi
          git config user.name "homelab-workspaces-deployer[bot]"
          git config user.email "344521357+homelab-workspaces-deployer[bot]@users.noreply.github.com"
          git commit -am "reviews: promote to prod"
          git push --force origin promote-reviews
          # gh pr view also finds the merged PR from an earlier promote, so list open ones only.
          if [ -n "$(gh pr list --head promote-reviews --state open --json number -q '.[].number')" ]; then
            gh pr edit promote-reviews --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --head promote-reviews --title "reviews: promote to prod" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
